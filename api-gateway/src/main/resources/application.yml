server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        # Route sang Auth-Service
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # Route sang Order-Service (Resource Server)
        - id: order-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

